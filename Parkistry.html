<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Parkistry</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f6f5;--fg:#0e1a2b;--card:#fff;--mut:#5b6b7d;--bd:#d9e1e0;--ink:#0e1a2b;--g:#16a34a;--b:#2563eb;--y:#d99a00;--r:#dc2626;--gr:#8b95a1}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1320;--fg:#e8eef5;--card:#142033;--mut:#93a4b8;--bd:#25354c}}
:root[data-theme=dark]{--bg:#0b1320;--fg:#e8eef5;--card:#142033;--mut:#93a4b8;--bd:#25354c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Sora,system-ui,sans-serif;font-size:14px}
.w{max-width:1100px;margin:0 auto;padding:14px}
nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 14px;background:var(--ink);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav b{letter-spacing:.14em;margin-right:auto;font-weight:800}nav button{background:none;border:0;color:#cfe;padding:6px 10px;border-radius:8px;cursor:pointer;font:inherit}nav button.on{background:#1f3a35;color:#fff}
.demo{background:#fff3c4;color:#6b4e00;font-size:12px;text-align:center;padding:4px}
button{font:inherit;cursor:pointer}.btn{background:var(--g);color:#fff;border:0;padding:10px 16px;border-radius:10px;font-weight:600}.btn.alt{background:var(--b)}.btn.ghost{background:none;border:1px solid var(--bd);color:var(--fg)}.btn.red{background:var(--r)}.btn.sm{padding:6px 10px;font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.hero{padding:54px 8px 30px}.hero h1{font-size:clamp(40px,9vw,84px);margin:0;letter-spacing:.06em;font-weight:800}.tag{font-size:20px;color:var(--g);margin:6px 0}
.big{font-size:26px;font-weight:800}.mut{color:var(--mut)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;color:#fff}
input,select{font:inherit;padding:9px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--fg);width:100%;margin:4px 0}
.opt{border:2px solid var(--bd);background:var(--card);color:var(--fg);padding:22px;border-radius:14px;font-weight:800;font-size:18px;flex:1;min-width:140px}.opt.on{border-color:var(--g);background:rgba(22,163,74,.1)}
.rec{border:2px solid var(--g);background:rgba(22,163,74,.08)}.map{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:14px}
.map text{font-family:Sora,sans-serif;pointer-events:none}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}
.bar{height:12px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.qr{display:grid;grid-template-columns:repeat(9,10px);gap:1px;width:100px}.qr i{width:10px;height:10px;background:var(--fg)}.qr i.o{background:transparent}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{padding:7px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}.tabs .on{background:var(--ink);color:#fff}
.warn{background:rgba(217,154,0,.15);border:1px solid var(--y);border-radius:10px;padding:8px;margin:8px 0}
</style></head><body><div class="demo">DEMO SIMULATION MODE — sensors, cameras, traffic, calls, SMS and EV chargers are simulated. No hardware or live service is connected.</div><div id="app"></div>
<script>
const $=s=>document.querySelector(s),LV=['LOW','MODERATE','HEAVY','SEVERE'],MUL=[1,1.4,2,3.3],LVC={NORMAL:0,MODERATE:1,HEAVY:2,ACCIDENT:3,'ROAD BLOCKED':3,CONSTRUCTION:2};
const DEST={'Central Market':[3.2,9],'City Hospital':[4.5,12],'Tech Park':[6.1,16],'Metro Central':[2.4,7],'Stadium':[5,13]},HD={'Road Block':15,Accident:10,Construction:5,'Temporary Closure':12,Waterlogging:6};
const tm=x=>new Date(x).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),mn=x=>Math.max(0,Math.round(x/6e4)),pad=x=>String(x).padStart(2,'0');
let S,ui={view:'home',step:0,adm:'dash',sel:null,opts:null,as:'A12',emReason:'Emergency Vehicle Access',err:'',f:{type:'4W',ev:false,purpose:'Regular',name:'',mob:'',veh:'',dest:'Central Market',dur:60,loc:'Demo location (simulated)'}};
const slot=id=>S.slots.find(s=>s.id===id);
function seed(){const N=Date.now(),sl=[],G=[['A',12,'4W','Regular',4,20,30,52,60,6,'A'],['B',6,'2W','Regular',0,20,170,52,50,6,'A'],['C',6,'4W','Cab',0,340,30,46,90,6,'B'],['D',6,'4W','Metro',2,340,170,46,110,6,'B'],['E',4,'2W','Metro',0,340,215,46,100,6,'B']];
G.forEach(([p,n,type,zone,ev,gx,gy,st,d,c,rt])=>{for(let i=0;i<n;i++){const e=i>=n-ev;sl.push({id:p+pad(i+1),type,zone,ev:e,st:'available',free:null,until:null,veh:null,resId:null,em:false,rt,dist:d+(n-1-i)*14,sec:i%3?'Camera + entry tracking':'Camera monitored',sensor:'OK',obs:false,upd:N,sid:'SN-'+p+pad(i+1),ch:e?'AVAILABLE':null,x:gx+(i%c)*st,y:gy+Math.floor(i/c)*48})}});
S={slots:sl,res:[],notes:[],calls:[],hazards:[{id:1,route:'B',type:'Construction',desc:'Lane closed near market gate',yes:12,no:0,t:N}],cam:{A:{mode:'NORMAL'},B:{mode:'NORMAL'}},events:[],emerg:null,stats:{searches:0,booked:0,realloc:0,ev:0}};
const occ=(id,m,nm,pl)=>{const s=slot(id);s.st='occupied';s.free=N+m*6e4;s.veh={name:nm,plate:pl}};
occ('A05',60,'Ravi','TN39 AB 1001');occ('A06',20,'Meena','TN39 CD 2002');occ('A07',14,'Karan','TN39 EF 3003');occ('A10',16,'Divya','TN39 EV 4004');slot('A10').ch='COMPLETED';occ('B02',25,'Arun','TN39 X 5005');occ('C02',10,'Cab 41','TN39 T 6006');occ('C03',30,'Cab 17','TN39 T 7007');occ('D03',40,'Sana','TN39 M 8008');occ('E01',8,'Vik','TN39 Y 9009');
slot('A03').st='maint';slot('A04').st='blocked';slot('A08').until=N+45*6e4;ui.sel=null}
function notify(type,msg,sev){S.notes.unshift({t:Date.now(),type,msg,sev:sev||'info',read:false})}
function logE(m){S.events.unshift({t:Date.now(),m})}
function call(id,to,msg){const c={id:S.calls.length+1,t:Date.now(),slot:id,to,msg,state:'CALL INITIATED'};S.calls.unshift(c);notify('Simulated SMS','SMS to '+to+': '+msg,'warn');[[1200,'CALLING'],[2600,'CONNECTED'],[4200,'COMPLETED']].forEach(([d,st])=>setTimeout(()=>{c.state=st;render()},d))}
function conf(h){const v=h.yes-h.no;return v>=8?'HIGH':v>=3?'MEDIUM':'LOW'}
function route(dest){const [km,m]=DEST[dest||ui.f.dest],R={};['A','B'].forEach(k=>{const c=S.cam[k],lv=LVC[c.mode],cl=c.mode==='ROAD BLOCKED';let t=m*(k=='A'?1:1.25)*MUL[lv];S.hazards.forEach(h=>{if(h.route===k&&conf(h)!=='LOW'&&HD[h.type])t+=HD[h.type]});if(cl)t+=90;R[k]={k,km:+(km*(k=='A'?1:1.15)).toFixed(1),t:Math.round(t),lv,closed:cl,status:cl?'CLOSED':c.mode==='NORMAL'?'Clear':c.mode.toLowerCase()}});
const open=[R.A,R.B].filter(r=>!r.closed).sort((a,b)=>a.t-b.t);R.best=open[0]||R.B;return R}
function rec(f,eta,skip){const R=route(f.dest),dur=f.dur*6e4,out=[],base=Math.min(R.A.t,R.B.t);
S.slots.forEach(s=>{if(s.id===skip||s.type!==f.type||s.zone!==f.purpose||s.em||['blocked','maint','reserved'].includes(s.st))return;
if(f.ev&&!(s.ev&&['AVAILABLE','COMPLETED'].includes(s.ch)))return;let start=eta,state='avail';
if(s.st==='occupied'){if(!s.free||s.free>eta+6e5)return;start=Math.max(eta,s.free);state=s.free<=eta?'likely':'soon'}
if(s.until&&start+dur>s.until)return;const lim=s.until?s.until-start:Infinity,rt=R[s.rt].t,wait=start-eta;
const sc=20+(state==='soon'?16*Math.max(0,1-wait/6e5):20)+15*Math.max(0,1-s.dist/300)+15*Math.min(1,base/rt)+10*Math.min(1,lim/(dur*1.5))+(f.ev===s.ev?10:f.ev?0:4)+(s.sec[7]==='+'?5:3)+5*Math.max(0,1-s.dist/250);
out.push({s,sc:Math.round(sc),start,state,lim,lv:R[s.rt].lv})});return out.sort((a,b)=>b.sc-a.sc)}
function recheck(){S.res.filter(r=>['RESERVED','ARRIVING'].includes(r.status)&&!r.alt).forEach(r=>{const s=slot(r.slot);if(s.em||s.resId!==r.id||s.st!=='reserved'){const R=route(r.f.dest),a=rec(r.f,Date.now()+R.best.t*6e4,r.slot)[0];
if(a){r.alt=a.s.id;notify('Alternative assigned','Your reserved slot '+r.slot+' is unavailable. Alternative: '+a.s.id+' ('+a.s.dist+'m'+(a.s.ev?', EV charger':'')+').','warn');call(r.slot,r.f.mob||'user','Your reservation in Slot '+r.slot+' changed. Please check the Parkistry app.')}else{notify('Slot changed','Slot '+r.slot+' unavailable and no compatible alternative is free.','bad')}}})}
const A={go(v){ui.view=v;ui.sel=null;window.scrollTo(0,0);render()},set(k,v){ui.f[k]=v;render()},setn(k,v){ui.f[k]=v},
next(){const f=ui.f;if(ui.step===1&&!(f.name&&f.mob&&f.veh)){ui.err='Enter name, mobile number and vehicle number.';return render()}ui.err='';if(ui.step===2)S.stats.searches++;ui.step++;render()},
vt(t){ui.f.type=t;if(t==='2W')ui.f.ev=false;ui.f.purpose='Regular';ui.step=1;render()},
geo(){const fin=(l)=>{ui.f.loc=l;render()};if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>fin('Your location ('+p.coords.latitude.toFixed(3)+', '+p.coords.longitude.toFixed(3)+')'),()=>fin('Demo location (simulated)'),{timeout:3000});else fin('Demo location (simulated)')},
pick(id){const s=slot(id),f=ui.f;if(ui.view==='find'&&(s.type!==f.type||s.zone!==f.purpose))return;ui.sel=id;render()},
reserve(id){const s=slot(id),f={...ui.f},R=route();if(!s||!['available','occupied'].includes(s.st)||s.em){notify('Slot changed','Slot '+id+' is no longer available.','bad');return render()}
const r={id:'PKY-'+Math.random().toString(36).slice(2,7).toUpperCase(),slot:id,f,eta:Date.now()+R.best.t*6e4,dur:f.dur*6e4,status:'RESERVED'};s.st='reserved';s.resId=r.id;s.free=null;s.veh=null;if(s.ch)s.ch='OCCUPIED',S.stats.ev++;S.res.unshift(r);S.stats.booked++;
notify('Reservation confirmed','Booking '+r.id+' — Slot '+id+', arrival '+tm(r.eta)+'.','ok');logE('Reservation '+r.id+' on '+id);ui.sel=null;ui.view='my';render()},
rel(r){const o=slot(r.slot);if(o.resId===r.id){o.st='available';o.resId=null;if(o.ch==='OCCUPIED'||o.ch==='CHARGING')o.ch='AVAILABLE'}},
cancel(id,why){const r=S.res.find(x=>x.id===id);this.rel(r);r.status=why||'CANCELLED';notify('Reservation '+r.status.toLowerCase(),r.id+' released slot '+r.slot+'.','warn');logE(r.id+' '+r.status);render()},
accept(id,to){const r=S.res.find(x=>x.id===id),n=slot(to||r.alt);if(!n||n.st!=='available'){notify('Slot changed','That slot was just taken.','bad');r.alt=null;return recheck(),render()}
this.rel(r);r.slot=n.id;n.st='reserved';n.resId=r.id;if(n.ch)n.ch='OCCUPIED';r.alt=null;ui.opts=null;S.stats.realloc++;notify('Alternative assigned','Reservation moved to '+n.id+'.','ok');render()},
step(id,st){const r=S.res.find(x=>x.id===id),s=slot(r.slot);r.status=st;if(st==='PARKED'){r.start=Date.now();r.end=r.start+r.dur;s.st='occupied';s.free=r.end;s.veh={name:r.f.name,plate:r.f.veh};if(s.ch)s.ch='CHARGING';notify('Check-in reminder','Parking started in '+s.id+'. Timer running.','ok')}
if(st==='CHECKED_OUT'){s.st='available';s.free=null;s.veh=null;s.resId=null;if(s.ch)s.ch='AVAILABLE';r.out=Date.now();notify('Reservation checked out','Slot '+s.id+' is available again.','ok')}render()},
extend(id,m){const r=S.res.find(x=>x.id===id),s=slot(r.slot),ne=r.end+m*6e4;if(s.until&&ne>s.until){const a=rec({...r.f,dur:m+mn(r.end-Date.now())},Date.now(),r.slot)[0];r.extAlt=a?{id:a.s.id,m}:null;notify('Parking extension','Slot '+s.id+' is booked after '+tm(s.until)+'. '+(a?'Try '+a.s.id+'.':'No alternative free.'),'warn');return render()}
r.end=ne;s.free=ne;r.warned=false;r.dur+=m*6e4;notify('Parking extension','Extended '+m+' min. New end '+tm(ne)+'.','ok');render()},
moveExt(id){const r=S.res.find(x=>x.id===id),o=slot(r.slot),n=slot(r.extAlt.id);o.st='available';o.free=null;o.veh=null;if(o.ch)o.ch='AVAILABLE';n.st='occupied';n.veh={name:r.f.name,plate:r.f.veh};r.end+=r.extAlt.m*6e4;n.free=r.end;if(n.ch)n.ch='CHARGING';r.slot=n.id;r.extAlt=null;render()},
keep(id){const r=S.res.find(x=>x.id===id);r.eta+=10*6e4;r.warn=false;notify('Reservation kept','Grace period extended 10 minutes.','ok');render()},
opts(id){ui.opts=ui.opts===id?null:id;render()},
// admin
cam(k,m){S.cam[k].mode=m;logE('Camera '+k+' → '+m);const R=route();notify('Traffic changed','Route '+k+' now '+m+'. Best ETA '+R.best.t+' min.','warn');recheck();render()},
both(m){S.cam.A.mode=m;S.cam.B.mode=m;logE('Traffic '+m);notify('Traffic changed','All routes '+m+'. Best ETA '+route().best.t+' min.','warn');render()},
sens(id,a){const s=slot(id);s.upd=Date.now();if(a==='arr'){s.st='occupied';s.free=Date.now()+30*6e4;s.veh=s.veh||{name:'Unknown vehicle',plate:'—'}}
if(a==='leave'){s.st='available';s.free=null;s.veh=null;s.obs=false;s.resId&&s.st!=='reserved'&&0}if(a==='obs'){s.st='blocked';s.obs=true}if(a==='off')s.sensor='OFFLINE';if(a==='on')s.sensor='OK';
if(a==='leave'){const r=S.res.find(x=>x.id===s.resId&&['RESERVED','ARRIVING'].includes(x.status));if(r)s.st='reserved'}
logE('Sensor '+s.sid+': '+a);notify('Slot changed','Sensor event on '+id+': '+a.toUpperCase(),'info');recheck();render()},
chg(id,st){const s=slot(id);s.ch=st;logE('Charger '+id+' '+st);notify('Slot changed','Charger '+id+' → '+st,'info');render()},
emerg(reason){const aff=['A05','A06','A07','A08'];const ord=['A05','A06','A07'].filter(i=>slot(i).veh).map(i=>({id:i,done:false}));aff.forEach(i=>slot(i).em=true);S.emerg={reason,ord};logE('EMERGENCY: '+reason);
notify('Emergency clearance',reason+' — slots A05–A08 restricted.','bad');ord.forEach((o,i)=>{const v=slot(o.id).veh;notify('Vehicle movement required',(i?'THEN move ':'MOVE FIRST: ')+v.name+' ('+v.plate+') in '+o.id,'bad');call(o.id,v.name,'Your vehicle in Slot '+o.id+' needs to be moved. Please check the Parkistry app.')});recheck();render()},
moved(id){const s=slot(id),o=S.emerg.ord.find(x=>x.id===id);o.done=true;s.veh=null;s.free=null;s.st='blocked';render()},
clear(){if(!S.emerg)return;S.slots.filter(s=>s.em).forEach(s=>{s.em=false;s.veh=null;s.free=null;s.st=s.resId?'reserved':'available'});S.emerg=null;notify('Emergency clearance','Emergency cleared; slots reopened.','ok');render()},
hz(){const f=document.forms[0];},addHz(){const r=$('#hr').value,t=$('#ht').value,d=$('#hd').value||t;S.hazards.unshift({id:Date.now(),route:r,type:t,desc:d,yes:1,no:0,t:Date.now()});notify('Hazard',t+' reported on '+(r==='Slots'?'parking area':'Route '+r)+'.','warn');recheck();render()},
vote(id,y){const h=S.hazards.find(x=>x.id===id);y?h.yes++:h.no++;notify('Hazard','Confirmation on '+h.type+': confidence '+conf(h),'info');recheck();render()},
rmHz(id){S.hazards=S.hazards.filter(h=>h.id!==id);render()},
demo(k){const r=S.res.find(x=>['RESERVED','ARRIVING'].includes(x.status)),p=S.res.find(x=>x.status==='PARKED');
const m={arr:()=>A.sens('A12','arr'),lv:()=>A.sens('A12','leave'),hv:()=>A.both('HEAVY'),cl:()=>A.both('NORMAL'),con:()=>A.cam('A','CONSTRUCTION'),acc:()=>A.cam('A','ACCIDENT'),blk:()=>A.cam('A','ROAD BLOCKED'),sf:()=>A.sens('A12','off'),sr:()=>A.sens('A12','on'),eo:()=>A.chg('A12','OCCUPIED'),ea:()=>A.chg('A12','AVAILABLE'),em:()=>A.emerg('Emergency Vehicle Access'),
re:()=>{if(!r){notify('Slot changed','Reserve a slot first, then trigger reallocation.','warn');return render()}A.sens(r.slot,'obs')},call:()=>{call('A12','Demo user','Your vehicle in Slot A12 needs to be moved. Please check the Parkistry app.');render()},
ex:()=>{if(!p){notify('Parking expiring','Start a parking session first.','warn');return render()}p.end=Date.now()+14*6e4;slot(p.slot).free=p.end;p.warned=false;render()},ns:()=>{if(!r){notify('Slot changed','Reserve a slot first.','warn');return render()}r.eta=Date.now()-11*6e4;render()},rs:()=>{seed();ui.step=0;ui.sel=null;notify('Demo','Entire demo reset to clean scenario.','ok');render()}};m[k]()}};
function tick(){const n=Date.now();S.res.forEach(r=>{if(['RESERVED','ARRIVING'].includes(r.status)){if(n>r.eta+15*6e4){A.cancel(r.id,'EXPIRED');notify('Reservation expired','No-show: slot '+r.slot+' released.','bad')}else if(n>r.eta+10*6e4&&!r.warn){r.warn=true;notify('Check-in reminder','Your reservation is about to expire.','warn')}}
if(r.status==='PARKED'&&r.end-n<15*6e4&&!r.warned){r.warned=true;notify('Parking expiring','Your parking expires in '+mn(r.end-n)+' minutes.','warn')}});if(ui.view==='my')render()}
// views
const col=(s,h)=>h===s.id?'var(--g)':s.st==='maint'?'var(--gr)':s.em||['blocked','reserved'].includes(s.st)?'var(--r)':s.st==='occupied'?s.free?'var(--y)':'var(--r)':'var(--b)';
function map(u,h){let x='<svg viewBox="0 0 640 262" class=map role=img aria-label="Parking map">';[['A · Regular 4-wheeler',20,22],['B · 2-wheeler',20,162],['C · Cab waiting zone',340,22],['D · Metro park & ride',340,162],['E · Metro 2-wheeler',340,207]].forEach(l=>x+=`<text x=${l[1]} y=${l[2]} font-size=11 fill=var(--mut)>${l[0]}</text>`);
S.slots.forEach(s=>{const d=u&&(s.type!==ui.f.type||s.zone!==ui.f.purpose);x+=`<g onclick="A.pick('${s.id}')" style="cursor:${d?'default':'pointer'};opacity:${d?.15:1}"><rect x=${s.x} y=${s.y} width=${s.sid.length>0?40:40} height=38 rx=6 fill="${col(s,h)}" ${ui.sel===s.id?'stroke=var(--fg) stroke-width=3':''}/><text x=${s.x+20} y=${s.y+16} text-anchor=middle fill=#fff font-size=11 font-weight=700>${s.id}</text><text x=${s.x+20} y=${s.y+30} text-anchor=middle fill=#fff font-size=10>${s.ev?'⚡EV':''}${s.type==='2W'?'2W':''}</text></g>`});
return x+'</svg><div class="row mut" style="font-size:11px;margin-top:4px"><span style="color:var(--g)">■ Recommended</span><span style="color:var(--b)">■ Available</span><span style="color:var(--y)">■ Available soon</span><span style="color:var(--r)">■ Unavailable</span><span>■ Maintenance</span></div>'}
const pill=(t,c)=>`<span class=pill style="background:${c}">${t}</span>`,lvc=l=>['var(--g)','var(--b)','var(--y)','var(--r)'][l];
function qr(id){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;let o='';for(let i=0;i<81;i++){h=(h*1103515245+12345)>>>0;o+=`<i class="${h>>16&1?'':'o'}"></i>`}return `<div class=qr>${o}</div>`}
function slotCard(s,sel){const r=sel?rec(ui.f,Date.now()+route().best.t*6e4).find(x=>x.s.id===s.id):null;return `<div class=card><div class=row><b class=big>${s.id}</b>${pill(s.st.toUpperCase(),col(s))}<span class=mut>${s.type} · ${s.zone}${s.ev?' · EV '+s.ch:''}</span></div><p>Distance ${s.dist}m · ${s.sec} · ${s.free&&s.st==='occupied'?'Expected free '+tm(s.free):'Available'+(s.until?' until '+tm(s.until):'')}</p>${r?`<button class=btn onclick="A.reserve('${s.id}')">${r.state==='soon'?'REQUEST SLOT':'RESERVE'}</button>`:'<span class=mut>Not reservable for your current trip.</span>'} <button class="btn ghost" onclick="ui.sel=null;render()">Close</button></div>`}
const views={
home(){const av=S.slots.filter(s=>s.st==='available').length;return `<div class=w><div class=hero><h1>PARKISTRY</h1><p class=tag>“Know Where You’ll Park Before You Arrive.”</p><p style="max-width:620px">Parkistry is a smart parking management platform that predicts parking availability, recommends the most suitable parking slot, considers traffic and road conditions, and dynamically manages parking reservations.</p><div class=row><button class=btn onclick="ui.step=0;A.go('find')">FIND PARKING</button><button class="btn ghost" onclick="A.go('admin')">ADMIN DASHBOARD</button></div></div>
<div class="grid g2">${[['Smart Parking','Scores every compatible slot for your vehicle and trip.'],['Predictive Availability','Occupied slots show when they will free up.'],['Live Traffic Intelligence','Traffic changes move your ETA and your slot.'],['EV Parking','Only slots with a free charger for EV drivers.'],['Dynamic Reallocation','Lost your slot? Get the next best one.'],['Emergency Clearance','Dependency-aware vehicle movement order.']].map(c=>`<div class=card><b>${c[0]}</b><p class=mut>${c[1]}</p></div>`).join('')}</div>
<div class=grid><div class=card><div class=big>−62%</div>Search time reduced (demo)</div><div class=card><div class=big>${av}</div>Available slots</div><div class=card><div class=big>${S.res.filter(r=>!['CANCELLED','EXPIRED','CHECKED_OUT'].includes(r.status)).length}</div>Active reservations</div><div class=card><div class=big>${S.slots.filter(s=>s.ev).length}</div>EV slots</div><div class=card><div class=big>${Object.values(S.cam).filter(c=>c.mode!=='NORMAL').length?'Rerouting':'2 live'}</div>Traffic-aware routes (demo data)</div></div></div>`},
find(){const f=ui.f,st=ui.step;let h='<div class=w>';
if(st===0)h+=`<h2>What are you driving?</h2><div class=row><button class="opt" onclick="A.vt('2W')">2-WHEELER</button><button class="opt" onclick="A.vt('4W')">4-WHEELER</button></div>`;
if(st===1){const P=f.type==='4W'?[['Regular','REGULAR PARKING'],['Cab','CAB DRIVER WAITING'],['Metro','METRO / PARK & RIDE']]:[['Regular','REGULAR PARKING'],['Metro','METRO / PARK & RIDE']];
h+=`<h2>Vehicle details (${f.type==='4W'?'4-wheeler':'2-wheeler'})</h2><div class=card><label>Name<input value="${f.name}" onchange="A.setn('name',this.value)"></label><label>Mobile number<input inputmode=tel value="${f.mob}" onchange="A.setn('mob',this.value)"></label><label>Vehicle number<input value="${f.veh}" onchange="A.setn('veh',this.value)"></label>
${f.type==='4W'?`<p><b>Is this an EV?</b></p><div class=row><button class="opt ${f.ev?'on':''}" style="padding:12px" onclick="A.set('ev',true)">YES</button><button class="opt ${f.ev?'':'on'}" style="padding:12px" onclick="A.set('ev',false)">NO</button></div>`:''}
<p><b>Parking purpose</b></p><div class=row>${P.map(p=>`<button class="opt ${f.purpose===p[0]?'on':''}" style="padding:12px;font-size:13px" onclick="A.set('purpose','${p[0]}')">${p[1]}</button>`).join('')}</div>${ui.err?`<p style="color:var(--r)">${ui.err}</p>`:''}<p><button class=btn onclick="A.next()">Continue</button></p></div>`}
if(st===2){h+=`<h2>Where are you going?</h2><div class=card><select onchange="A.setn('dest',this.value)">${Object.keys(DEST).map(d=>`<option ${d===f.dest?'selected':''}>${d}</option>`).join('')}</select><p class=mut>Starting from: ${f.loc}</p><button class="btn ghost sm" onclick="A.geo()">Use current location</button>
<p><b>How long do you need parking?</b></p><div class=row>${[30,60,120,180].map(d=>`<button class="opt ${f.dur===d?'on':''}" style="padding:12px;font-size:13px" onclick="A.set('dur',${d})">${d<60?d+' minutes':d/60+(d>60?' hours':' hour')}</button>`).join('')}</div><label>Custom (minutes)<input type=number min=10 value="${f.dur}" onchange="A.set('dur',Math.max(10,+this.value||60))"></label><p class=mut>Arrival time is calculated from traffic — you don’t enter it.</p><button class=btn onclick="A.next()">Find my parking</button></div>`}
if(st===3){const R=route(),eta=Date.now()+R.best.t*6e4,L=rec(f,eta),top=L[0],hz=S.hazards.filter(x=>x.route===R.best.k||x.route==='Slots')[0];
h+=`<h2>Your trip</h2><div class=grid><div class=card><div class=mut>Estimated arrival</div><div class=big>${tm(eta)}</div></div><div class=card><div class=mut>Travel time</div><div class=big>${R.best.t} min</div></div><div class=card><div class=mut>Traffic</div><div class=big style="color:${lvc(R.best.lv)}">${LV[R.best.lv]}</div></div><div class=card><div class=mut>Recommended leave</div><div class=big>${tm(Date.now()+6e4*2)}</div></div></div>
<div class=card><b>Routes</b> <span class=pill style="background:var(--gr)">DEMO TRAFFIC DATA</span><table>${['A','B'].map(k=>`<tr><td>Route ${k}</td><td>${R[k].km} km</td><td>${R[k].closed?'—':R[k].t+' min'}</td><td>${pill(R[k].closed?'CLOSED':LV[R[k].lv],lvc(R[k].lv))}</td><td>${R[k].status}</td><td>${R.best.k===k?'★ best':''}</td></tr>`).join('')}</table></div>${hz?`<div class=warn>⚠ Road issue reported ahead: ${hz.type} — ${hz.desc} (confidence ${conf(hz)})</div>`:''}`;
if(!top)h+=`<div class=card><b>No compatible slot for ${f.dur} min right now.</b><p class=mut>Try a shorter duration or a different parking purpose.</p><button class=btn onclick="ui.step=2;render()">Change trip</button></div>`;
else{const txt=x=>x.state==='avail'?'Available when you arrive':x.state==='likely'?'Likely available when you arrive (predicted free '+tm(x.s.free)+')':'Available in '+mn(x.start-Date.now())+' min (expected free '+tm(x.s.free)+')';
const c=(x,t)=>`<div class="card ${t?'rec':''}">${t?'<b style="color:var(--g)">⭐ RECOMMENDED FOR YOU</b>':''}<div class=row><b class=big>${x.s.id}</b><span class=mut>${x.s.type}${x.s.ev?' · EV Charger Available':''} · ${x.s.dist}m away · score ${x.sc}</span></div><p>${txt(x)}<br>Available for ${x.lim===Infinity?'your full '+f.dur+' min (open-ended)':mn(x.lim)+' min'} · ${LV[x.lv]} traffic route · ${x.s.sec.startsWith('Camera +')?'Security monitored':'Camera monitored'}</p><button class=btn style="${t?'':'background:'+(x.state==='soon'?'var(--y)':'var(--b)')}" onclick="A.reserve('${x.s.id}')">${x.state==='soon'?'REQUEST SLOT':'RESERVE'}</button></div>`;
h+=c(top,1)+'<h3>Other options</h3>'+L.slice(1,6).map(x=>c(x,0)).join('')}
h+=`<h3>Map</h3>${map(1,top&&top.s.id)}${ui.sel?slotCard(slot(ui.sel),1):''}<p><button class="btn ghost" onclick="ui.step=2;render()">Edit trip</button></p>`}
return h+'</div>'},
my(){const L=S.res;if(!L.length)return `<div class=w><div class=card><b>No reservations yet.</b><p><button class=btn onclick="ui.step=0;A.go('find')">Find parking</button></p></div></div>`;
return `<div class=w><h2>My reservations</h2>`+L.map(r=>{const s=slot(r.slot),act=['RESERVED','ARRIVING','CHECKED_IN','PARKED'].includes(r.status),R=route(r.f.dest),eta=Date.now()+R.best.t*6e4,B=(t,fn,c)=>`<button class="btn ${c||''}" onclick="${fn}">${t}</button> `;
return `<div class=card><div class=row><b class=big>${r.id}</b>${pill(r.status.replace('_',' '),act?'var(--g)':'var(--gr)')}<span class=mut>Slot ${r.slot} · ${r.f.type}${r.f.ev?' · EV':''} · ${r.f.purpose} · ${s.sec.startsWith('Camera +')?'Security monitored':'Camera monitored'}</span></div>
<div class=row style="margin:8px 0"><div>${qr(r.id)}<div class=mut style="font-size:10px">Check-in code</div></div><div>${r.f.name} · ${r.f.veh}<br>Arrival ETA: <b>${tm(['RESERVED','ARRIVING'].includes(r.status)?eta:r.eta)}</b> ${['RESERVED','ARRIVING'].includes(r.status)?'('+R.best.t+' min, '+LV[R.best.lv]+' traffic)':''}<br>${r.status==='PARKED'?'Parking ends '+tm(r.end)+' — <b>'+mn(r.end-Date.now())+' min left</b>':'Duration '+mn(r.dur)+' min · expected departure '+tm(r.eta+r.dur)}</div></div>
${r.alt?`<div class=warn><b>Your reserved slot ${r.slot} is temporarily unavailable.</b><br>Alternative found: ${r.alt} · ${slot(r.alt).dist}m away${slot(r.alt).ev?' · EV charger':''} · available for your duration<br>${B('ACCEPT ALTERNATIVE',`A.accept('${r.id}')`)}${B('VIEW OTHER OPTIONS',`A.opts('${r.id}')`,'ghost')}</div>`:''}
${ui.opts===r.id?rec(r.f,eta,r.slot).slice(0,4).map(x=>`<div class=row style="margin:4px 0"><b>${x.s.id}</b><span class=mut>${x.s.dist}m · score ${x.sc}</span>${B('Choose',`A.accept('${r.id}','${x.s.id}')`,'sm')}</div>`).join(''):''}
${r.warn&&['RESERVED','ARRIVING'].includes(r.status)?`<div class=warn>Your reservation is about to expire. ${B('KEEP RESERVATION',`A.keep('${r.id}')`)}${B('CANCEL',`A.cancel('${r.id}')`,'red')}</div>`:''}
${r.status==='PARKED'&&r.end-Date.now()<15*6e4?`<div class=warn>Your parking expires in ${mn(r.end-Date.now())} minutes.</div>`:''}
${r.extAlt?`<div class=warn>Slot is booked soon. Move to ${r.extAlt.id} to extend. ${B('MOVE & EXTEND',`A.moveExt('${r.id}')`)}</div>`:''}
<div class=row>${r.status==='RESERVED'?B('START NAVIGATION',`A.step('${r.id}','ARRIVING')`,'alt'):''}${r.status==='ARRIVING'?B('CHECK IN',`A.step('${r.id}','CHECKED_IN')`):''}${r.status==='CHECKED_IN'?B('START PARKING',`A.step('${r.id}','PARKED')`):''}${r.status==='PARKED'?B('EXTEND +30 MIN',`A.extend('${r.id}',30)`,'alt')+B('CHECK OUT',`A.step('${r.id}','CHECKED_OUT')`,'red'):''}${['RESERVED','ARRIVING'].includes(r.status)?B('CANCEL RESERVATION',`A.cancel('${r.id}')`,'ghost'):''}</div>
${r.status==='ARRIVING'?`<p class=mut>Navigating via Route ${R.best.k} · ${R.best.km} km · ${R.best.t} min · DEMO TRAFFIC DATA</p>`:''}</div>`}).join('')+'</div>'},
notes(){return `<div class=w><h2>Notifications</h2>${S.notes.map(n=>`<div class=card style="border-left:5px solid ${n.sev==='bad'?'var(--r)':n.sev==='warn'?'var(--y)':n.sev==='ok'?'var(--g)':'var(--b)'}"><b>${n.type}</b> <span class=mut>${tm(n.t)}</span><br>${n.msg}</div>`).join('')||'<p class=mut>Nothing yet.</p>'}${callsBox()}</div>`},
hazards(){return `<div class=w><h2>Road & hazard reports</h2><div class=card><b>Report an issue</b><select id=hr><option value=A>Route A</option><option value=B>Route B</option><option value=Slots>Parking area</option></select><select id=ht>${Object.keys(HD).concat(['Parking Obstruction','Other']).map(t=>`<option>${t}</option>`).join('')}</select><input id=hd placeholder="Description"><button class=btn onclick="A.addHz()">Submit report</button></div>${hazList(0)}</div>`}};
function hazList(adm){return S.hazards.map(h=>`<div class=card><b>${h.type}</b> · ${h.route==='Slots'?'Parking area':'Route '+h.route} ${pill(conf(h),conf(h)==='HIGH'?'var(--g)':conf(h)==='MEDIUM'?'var(--y)':'var(--gr)')}<br>${h.desc}<br><span class=mut>${h.yes} confirmations · ${h.no} says gone · Is this issue still present?</span><div class=row style="margin-top:6px"><button class="btn sm" onclick="A.vote(${h.id},1)">YES</button><button class="btn sm ghost" onclick="A.vote(${h.id},0)">NO</button>${adm?`<button class="btn sm red" onclick="A.rmHz(${h.id})">Resolve</button>`:''}</div></div>`).join('')||'<p class=mut>No reports.</p>'}
function callsBox(){return `<h3>AUTOMATED CALL SIMULATION <span class=pill style="background:var(--gr)">SIMULATED</span></h3>${S.calls.map(c=>`<div class=card><b>Parkistry Automated Call</b> · ${pill(c.state,c.state==='COMPLETED'?'var(--g)':'var(--b)')} <span class=mut>${tm(c.t)} → ${c.to}</span><br>“${c.msg}”</div>`).join('')||'<p class=mut>No calls yet.</p>'}`}
function admin(){const T=ui.adm,tabs=[['dash','Dashboard'],['ops','Sensors & EV'],['traffic','Traffic & cameras'],['emerg','Emergency'],['demo','Demo control'],['an','Analytics']],c=st=>S.slots.filter(s=>s.st===st).length;
let h=`<div class=w><div class=tabs>${tabs.map(t=>`<button class="${T===t[0]?'on':''}" onclick="ui.adm='${t[0]}';render()">${t[1]}</button>`).join('')}</div>`;
if(T==='dash'){const z=n=>S.slots.filter(s=>s.zone===n);h+=`<div class=grid style="margin-top:10px">${[['Total slots',S.slots.length],['Available',c('available')],['Reserved',c('reserved')],['Occupied',c('occupied')],['EV slots',S.slots.filter(s=>s.ev).length],['Cab slots',z('Cab').length],['Metro slots',z('Metro').length],['Blocked',c('blocked')],['Maintenance',c('maint')]].map(x=>`<div class=card><div class=big>${x[1]}</div>${x[0]}</div>`).join('')}</div>${map(0)}${ui.sel?slotCard(slot(ui.sel),0):''}
<div class="grid g2"><div class=card><b>CAB WAITING ZONE</b><p>${z('Cab').filter(s=>s.st==='occupied').length} / ${z('Cab').length} occupied · queue ${Math.max(0,z('Cab').filter(s=>s.st==='occupied').length-2)} · est. wait ${4+z('Cab').filter(s=>s.st==='occupied').length*2} min · EV 0 · Security monitored</p></div><div class=card><b>METRO / PARK & RIDE — Central Metro Station</b><p>${z('Metro').filter(s=>s.st==='available').length} / ${z('Metro').length} available · walking 3 min · EV ${z('Metro').filter(s=>s.ev).length} · Security monitored</p></div></div>
<div class=card><b>Vehicle dependencies</b><div class=row style="margin:8px 0">${['A05','A06','A07'].map((i,k)=>`<span class=pill style="background:var(--ink);padding:6px 12px">${i} ${slot(i).veh?slot(i).veh.name:'empty'}</span>${k<2?'→':''}`).join('')}</div><span class=mut>${S.emerg?'Move order: '+S.emerg.ord.map((o,i)=>(i?'THEN ':'MOVE ')+o.id).join(' → '):'A05 blocks A06, which blocks A07. Activate emergency clearance to compute the order.'}</span></div>
<div class=card><b>Reservations</b><table>${S.res.map(r=>`<tr><td>${r.id}</td><td>${r.f.name}</td><td>${r.slot}</td><td>${r.status}</td><td>${['RESERVED','ARRIVING'].includes(r.status)?`<button class="btn sm red" onclick="A.cancel('${r.id}')">Cancel</button>`:''}</td></tr>`).join('')||'<tr><td class=mut>None</td></tr>'}</table></div><div class=card><b>Hazards</b>${hazList(1)}</div><div class=card><b>Event log</b>${S.events.slice(0,8).map(e=>`<div class=mut>${tm(e.t)} · ${e.m}</div>`).join('')}</div>`}
if(T==='ops'){const s=slot(ui.as),B=(t,a)=>`<button class="btn sm" onclick="A.sens('${s.id}','${a}')">${t}</button> `;h+=`<div class=card><b>LIVE SENSOR SIMULATION</b> <span class=pill style="background:var(--gr)">SIMULATED</span><select onchange="ui.as=this.value;render()">${S.slots.map(x=>`<option ${x.id===ui.as?'selected':''}>${x.id}</option>`).join('')}</select><p>sensorId ${s.sid} · vehicleDetected ${s.st==='occupied'} · obstructionDetected ${s.obs} · sensorHealth ${s.sensor} · lastUpdated ${tm(s.upd)} · status ${s.st.toUpperCase()}</p>${B('VEHICLE ARRIVES','arr')}${B('VEHICLE LEAVES','leave')}${B('OBSTRUCTION DETECTED','obs')}${B('SENSOR OFFLINE','off')}${B('SENSOR RESTORED','on')}</div>
<div class=card><b>EV CHARGING SIMULATION</b><table>${S.slots.filter(x=>x.ev).map(x=>`<tr><td>${x.id}</td><td>CHG-${x.id}</td><td>Type 2 / CCS</td><td>${x.ch}</td><td>${x.ch==='CHARGING'||x.ch==='OCCUPIED'?'est. '+(x.veh?mn(x.free-Date.now())+' min':'reserved'):'—'}</td><td>${['AVAILABLE','OCCUPIED','MAINTENANCE','COMPLETED'].map(k=>`<button class="btn sm ghost" onclick="A.chg('${x.id}','${k}')">${k==='COMPLETED'?'COMPLETE':k}</button>`).join(' ')}</td></tr>`).join('')}</table></div>${callsBox()}`}
if(T==='traffic'){const R=route();h+=['A','B'].map(k=>{const m=S.cam[k].mode,l=LVC[m];return `<div class=card><b>Camera ${k} — Route ${k}</b> <span class=pill style="background:var(--gr)">SIMULATED CAMERA FEED</span><p>Traffic <b style="color:${lvc(l)}">${LV[l]}</b> · vehicles ${20+l*25} · avg speed ${Math.max(5,45-l*12)} km/h · road ${R[k].closed?'blocked':'open'} · incident ${['ACCIDENT','ROAD BLOCKED','CONSTRUCTION'].includes(m)?m:'none'} · ETA ${R[k].closed?'—':R[k].t+' min'}</p><div class=row>${Object.keys(LVC).map(x=>`<button class="btn sm ${x===m?'':'ghost'}" onclick="A.cam('${k}','${x}')">${x}</button>`).join('')}</div></div>`}).join('')+'<p class=mut>DEMO TRAFFIC DATA — changes move ETA, routes and recommendations.</p>'}
if(T==='emerg'){h+=`<div class=card><b>EMERGENCY CLEARANCE MODE</b><select onchange="ui.emReason=this.value">${['Emergency Vehicle Access','Road Closure','Construction','Accident','Public Event','Maintenance'].map(r=>`<option ${r===ui.emReason?'selected':''}>${r}</option>`).join('')}</select><div class=row><button class="btn red" onclick="A.emerg(ui.emReason)">ACTIVATE</button><button class="btn ghost" onclick="A.clear()">CLEAR EMERGENCY</button></div>${S.emerg?`<p><b>${S.emerg.reason}</b> — movement order:</p>${S.emerg.ord.map((o,i)=>`<div class=row style="margin:4px 0"><b>${i?'THEN':'MOVE FIRST'}: ${o.id}</b> ${slot(o.id).veh?slot(o.id).veh.name:'moved'}${o.done?pill('MOVED','var(--g)'):i===0||S.emerg.ord[i-1].done?`<button class="btn sm" onclick="A.moved('${o.id}')">Mark moved</button>`:pill('WAITING','var(--gr)')}</div>`).join('')}`:'<p class=mut>Inactive.</p>'}</div>`+callsBox()}
if(T==='demo'){const D=[['arr','Vehicle Arrives A12'],['lv','Vehicle Leaves A12'],['hv','Heavy Traffic'],['cl','Clear Traffic'],['con','Construction Detected'],['acc','Accident Detected'],['blk','Road Blocked'],['sf','Sensor Failure'],['sr','Sensor Restored'],['eo','EV Charger Occupied'],['ea','EV Charger Available'],['em','Emergency Clearance'],['re','Trigger Reallocation'],['call','Trigger Automated Call'],['ex','Parking Expiring'],['ns','No-show Test'],['rs','Reset Entire Demo']];
h+=`<div class=card><b>HACKATHON DEMO CONTROL CENTER</b> ${pill('DEMO SIMULATION MODE','var(--y)')}<div class=grid style="margin-top:8px">${D.map(d=>`<button class="btn ${d[0]==='rs'?'red':'alt'}" onclick="A.demo('${d[0]}')">${d[1]}</button>`).join('')}</div></div>`}
if(T==='an'){const t=S.slots.length,u=(c('occupied')+c('reserved'))/t*100,bar=(l,v,m)=>`<div style="margin:8px 0">${l}: <b>${v}</b><div class=bar><i style="width:${Math.min(100,v/m*100)}%"></i></div></div>`,fin=S.res.filter(r=>r.out);
h+=`<div class=card>${bar('Parking utilization %',Math.round(u),100)}${bar('Successful reservations',S.stats.booked,10)}${bar('Reallocated reservations',S.stats.realloc,5)}${bar('EV usage (EV bookings)',S.stats.ev,5)}${bar('Hazards reported',S.hazards.length,10)}${bar('Avg parking search time (min, simulated baseline 8.5 → 1.5)',S.stats.searches?1.5:8.5,10)}${bar('Time saved (min, est. 7 per booking)',S.stats.booked*7,60)}${bar('Avg parking duration (min)',fin.length?Math.round(fin.reduce((a,r)=>a+(r.out-r.start)/6e4,0)/fin.length):mn(S.res.reduce((a,r)=>a+r.dur,0)/(S.res.length||1)),180)}</div>`}
return h+'</div>'}
function nav(){const u=S.notes.filter(n=>!n.read).length;return `<nav><b>PARKISTRY</b>${[['home','Home'],['find','Find parking'],['my','My reservations'],['notes','Notifications'+(u?' ('+u+')':'')],['hazards','Hazards'],['admin','Admin']].map(v=>`<button class="${ui.view===v[0]?'on':''}" onclick="${v[0]==='find'&&ui.view!=='find'?'':''}A.go('${v[0]}')">${v[1]}</button>`).join('')}</nav>`}
function render(){if(ui.view==='notes')S.notes.forEach(n=>n.read=true);const v=ui.view==='admin'?admin:views[ui.view];$('#app').innerHTML=nav()+v()}
seed();render();setInterval(tick,1000);
</script></body></html>
